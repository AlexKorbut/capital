name: Tests

# Pull requests into any branch, including feat/*. Deploy stays in deploy.yml
# and still runs only for main. This workflow uses no repository secrets.
on:
  pull_request:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pytest
        # Dev config: SQLite + in-memory adapters, no external services.
        # FERNET_KEY is unset — crypto.py is a no-op without it.
        env:
          ENVIRONMENT: development
          DATABASE_URL: sqlite+aiosqlite:///./ci.db
          JWT_SECRET: ci_secret_min_32_chars_long_padding_value_xx
        run: pytest -q

  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck + build
        run: npm run build
